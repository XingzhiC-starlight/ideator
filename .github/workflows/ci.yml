name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: xcodebuild test -project Cards.xcodeproj -scheme Ideator -derivedDataPath build/DerivedData -disableAutomaticPackageResolution

  desk-invariants:
    name: Desk invariants
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Desk, Grid and Note match the reviewed fingerprint
        run: .claude/skills/check-desk-invariants/run.sh --require-reviewed
      # Re-recording the fingerprint makes it match, so a match can't say the search ran on this code.
      # The marker can: it is only saved after a pass of these exact inputs. A manual run ignores it.
      - name: Hash what the search and the mutants read
        id: inputs
        run: echo "key=$(.claude/skills/check-desk-invariants/run.sh --inputs-key)" >> "$GITHUB_OUTPUT"
      - name: Look for an earlier pass of these inputs
        id: passed
        uses: actions/cache/restore@v6
        with:
          path: build/desk-check/passed
          key: desk-invariants-passed-${{ steps.inputs.outputs.key }}
          lookup-only: true
      - name: Every command sequence up to depth 3
        if: steps.passed.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: .claude/skills/check-desk-invariants/run.sh
      - name: Every mutant is caught
        if: steps.passed.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: .claude/skills/check-desk-invariants/run.sh --mutants
      - name: Write the pass marker
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p build/desk-check && echo "${{ steps.inputs.outputs.key }}" > build/desk-check/passed
      - name: Save the pass marker
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/desk-check/passed
          key: desk-invariants-passed-${{ steps.inputs.outputs.key }}

  package:
    name: Disk image
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # package.sh counts commits for the build number
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Ideator-dmg
          path: build/release/*.dmg
          if-no-files-found: error
